<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <style>
        .info{
            color: blue;
        }
        .warning{
            color: yellow;
        }
        .error{
            color: red;
        }
    </style>
</head>
<body>
{#获取闪现的消息们#}
{% with messages=get_flashed_messages(with_categories=True) %}
    {% if messages %}
        <ul>
            {% for category,message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}
</body>
</html>
